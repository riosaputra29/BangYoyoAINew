<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="50%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="45" fill="url(#bg)"/>

  <!-- Sensor glow -->
  <circle cx="100" cy="45" r="25" fill="url(#glow)"/>

  <!-- LiDAR sensor -->
  <circle cx="100" cy="45" r="7" fill="#ffffff"/>

  <!-- Laser beams -->
  <g fill="none" stroke="#ffffff" stroke-width="2">
    <path d="M100 52 L58 158" opacity=".4"/>
    <path d="M100 52 L79 160" opacity=".55"/>
    <path d="M100 52 L100 162" opacity=".8"/>
    <path d="M100 52 L121 160" opacity=".55"/>
    <path d="M100 52 L142 158" opacity=".4"/>
  </g>

  <!-- Point cloud -->
  <g>
    <circle cx="58" cy="158" r="4" fill="#5eead4"/>
    <circle cx="79" cy="160" r="4.5" fill="#ffffff"/>
    <circle cx="100" cy="162" r="5" fill="#ffffff"/>
    <circle cx="121" cy="160" r="4.5" fill="#ffffff"/>
    <circle cx="142" cy="158" r="4" fill="#5eead4"/>

    <circle cx="71" cy="128" r="3" fill="#ffffff" opacity=".6"/>
    <circle cx="89" cy="130" r="3" fill="#5eead4"/>
    <circle cx="109" cy="130" r="3" fill="#5eead4"/>
    <circle cx="127" cy="128" r="3" fill="#ffffff" opacity=".6"/>
  </g>
</svg>
